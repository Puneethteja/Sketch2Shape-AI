<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketch2Shape AI — Microsoft TRELLIS.2-4B 3D Studio</title>
  <meta name="description" content="Generate manufacturing-ready 3D meshes in STL, OBJ, GLB, and PLY formats from 2D sketches using Microsoft TRELLIS Structured 3D Latents.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Three.js + OrbitControls for 3D Viewport -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
  <div id="app-root" class="app-layout">
    <!-- Left Sidebar Navigation -->
    <aside id="sidebar-root" class="app-sidebar"></aside>

    <!-- Main Workspace Area -->
    <div class="app-main-wrapper">
      <main id="main-content" class="main-content" role="main">
        <div id="view-container" class="view-container"></div>
      </main>

      <!-- Clean Elegant Footer -->
      <footer class="app-footer">
        <div class="footer-inner">
          <div class="footer-brand">
            <span>Sketch2Shape AI &middot; Microsoft TRELLIS.2-4B Engine</span>
          </div>
          <div class="footer-meta">
            <span class="footer-formats">Exports: STL &middot; OBJ &middot; GLB &middot; PLY</span>
            <span class="footer-links">
              <a href="#/studio">Studio</a>
              <span class="sep">&bull;</span>
              <a href="#/model">Model & Metrics</a>
              <span class="sep">&bull;</span>
              <a href="#/gallery">3D Gallery</a>
              <span class="sep">&bull;</span>
              <a href="#/metrics">Verification</a>
            </span>
          </div>
        </div>
      </footer>
    </div>

    <!-- Global Floating Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
